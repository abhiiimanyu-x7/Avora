<!-- Student Sidebar Navigation -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <a href="{{ url_for('landing') }}" class="sidebar-logo" style="text-decoration: none; display: flex; align-items: center; gap: 8px;">
            <img src="{{ url_for('static', filename='images/kmclu_crest.png') }}" alt="KMCLU Crest" style="width: 26px; height: 26px; object-fit: contain;">
            <span style="font-weight: 700; color: var(--accent);">AVORA</span>
        </a>
        <div style="display: flex; align-items: center; gap: 6px;">
            <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
            <span class="sidebar-role-badge">Student</span>
        </div>
    </div>
    
    <div class="sidebar-section-label">Campus Services</div>
    
    <nav class="sidebar-nav">
        <!-- Home / Dashboard -->
        <a href="{{ url_for('student.dashboard') }}" class="sidebar-item {% if request.endpoint == 'student.dashboard' %}active{% endif %}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Home</span>
        </a>

        <!-- 1. Elections -->
        <a href="{{ url_for('student.elections') }}" class="sidebar-item {% if 'election' in request.endpoint|default('') or 'vote' in request.endpoint|default('') or 'result' in request.endpoint|default('') %}active{% endif %}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <span>Elections</span>
        </a>

        <!-- 2. Lost & Found -->
        <a href="{{ url_for('lost_found.index') }}" class="sidebar-item {% if 'lost_found' in request.endpoint|default('') %}active{% endif %}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                <path d="M11 8v6"></path>
                <path d="M8 11h6"></path>
            </svg>
            <span>Lost &amp; Found</span>
        </a>

        <!-- 3. Notices & Deadlines -->
        <a href="{{ url_for('notices.index') }}" class="sidebar-item {% if 'notices' in request.endpoint|default('') %}active{% endif %}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span>Notices</span>
        </a>

        <!-- 4. Digital Wellbeing -->
        <a href="{{ url_for('wellbeing.index') }}" class="sidebar-item {% if 'wellbeing' in request.endpoint|default('') %}active{% endif %}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            <span>Wellbeing</span>
        </a>

        <!-- 5. Campus Contacts -->
        <a href="{{ url_for('contacts.index') }}" class="sidebar-item {% if 'contacts' in request.endpoint|default('') %}active{% endif %}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
            <span>Contacts</span>
        </a>

        <!-- 6. Campus Map -->
        <a href="{{ url_for('campus_map.index') }}" class="sidebar-item {% if 'campus_map' in request.endpoint|default('') %}active{% endif %}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                <line x1="8" y1="2" x2="8" y2="18"></line>
                <line x1="16" y1="6" x2="16" y2="22"></line>
            </svg>
            <span>Campus Map</span>
        </a>

        <!-- 7. Campus Issues -->
        <a href="{{ url_for('issues.index') }}" class="sidebar-item {% if 'issues' in request.endpoint|default('') %}active{% endif %}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <span>Campus Issues</span>
        </a>

        <div class="sidebar-section-label" style="padding-top: var(--space-20);">Personal</div>

        <!-- Profile & Notifications -->
        <a href="{{ url_for('student.profile') }}" class="sidebar-item {% if 'profile' in request.endpoint|default('') %}active{% endif %}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Profile</span>
            {% if unread_notifications > 0 %}
            <span class="notif-badge-count" style="margin-left: auto;">{{ unread_notifications }}</span>
            {% endif %}
        </a>
    </nav>
    
    <div class="sidebar-footer">
        <div class="sidebar-user">
            <div class="avatar avatar-sm">{{ (session.user_name or 'U')[0] | upper }}</div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name">{{ session.user_name }}</div>
                <div class="sidebar-user-email">{{ session.user_email }}</div>
            </div>
            <a href="{{ url_for('auth.logout') }}" class="sidebar-logout" title="Sign out" aria-label="Sign out">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </a>
        </div>
    </div>
</aside>
